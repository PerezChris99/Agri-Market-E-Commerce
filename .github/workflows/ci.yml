name: Agri-Market CI

on:
  push:
    branches: [perez, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agrimarket_ci
          POSTGRES_USER: agrimarket
          POSTGRES_PASSWORD: agrimarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agrimarket -d agrimarket_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      DJANGO_DEBUG: 'False'
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://localhost
      DATABASE_URL: postgresql://agrimarket:agrimarket@localhost:5432/agrimarket_ci
      DATABASE_SSL_REQUIRE: 'False'
      REDIS_URL: redis://localhost:6379/0
      AWS_STORAGE_BUCKET_NAME: ci-bucket
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key
      AWS_S3_REGION_NAME: us-east-1
      FLUTTERWAVE_SECRET_KEY: ci-flutterwave-secret
      SECURE_SSL_REDIRECT: 'True'
      SENTRY_DSN: ''
      CELERY_TASK_ALWAYS_EAGER: 'True'
      PAYPAL_MODE: sandbox
      MOMO_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify dependency consistency
        run: pip check

      - name: Compile Python sources
        run: python -m compileall -q ecommerce store

      - name: Django system checks
        run: python manage.py check

      - name: Django deployment checks
        run: python manage.py check --deploy

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Collect static assets
        run: python manage.py collectstatic --noinput

      - name: Run test suite
        run: python manage.py test store --verbosity 2

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
